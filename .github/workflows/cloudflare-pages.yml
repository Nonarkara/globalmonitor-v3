name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # wrangler 4.168 requires Node >= 22.12.
          node-version: 22
      - run: npm ci || npm install
      - run: npx vite build
        env:
          VITE_API_BASE_URL: ""
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Must match the wrangler devDependency. If this is unset and the
          # local binary is missing, wrangler-action@v3 installs 3.90.0, whose
          # miniflare calls zod's z.ostring(). The repo override pins zod 4,
          # which removed that method, so the action dies before any API call.
          wranglerVersion: "4.168.0"
          command: pages deploy dist --project-name=globalmonitor --branch=main
